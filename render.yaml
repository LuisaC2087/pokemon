services:
  - type: web
    name: pokemon-node
    env: node
    plan: free
    rootDir: microservices/pokemon-node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
  
  - type: web
    name: anime-python
    env: python
    plan: free
    rootDir: microservices/anime-python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false

  - type: web
    name: profesores-node
    env: node
    plan: free
    rootDir: microservices/profesores-node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URL
        sync: false

  - type: web
    name: pokemon-frontend
    runtime: static
    buildCommand: npm install && npx expo export -p web
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
