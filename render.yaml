services:
  - type: web
    name: pokemon-node
    env: node
    plan: free
    rootDir: microservices/pokemon-node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production

  - type: web
    name: anime-python
    env: python
    plan: free
    rootDir: microservices/anime-python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MONGO_URL
        sync: false

  - type: web
    name: profesores-node
    env: node
    plan: free
    rootDir: microservices/profesores-node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: NODE_ENV
        value: production

  - type: web
    name: chat-ia-node
    env: node
    plan: free
    rootDir: microservices/chat-ia-node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: POKEMON_SERVICE_URL
        value: https://pokemon-node-ueas.onrender.com
      - key: JUJUTSU_SERVICE_URL
        value: https://anime-python-ueas.onrender.com
      - key: PROFESORES_SERVICE_URL
        value: https://profesores-node-ueas.onrender.com
      - key: NODE_ENV
        value: production

  - type: web
    name: pokemon-frontend
    runtime: static
    rootDir: .
    buildCommand: npm install && npx expo export -p web
    staticPublishPath: dist
    envVars:
      - key: EXPO_PUBLIC_CHAT_IA_URL
        value: https://chat-ia-node-ueas.onrender.com
      - key: EXPO_PUBLIC_POKEMON_URL
        value: https://pokemon-node-ueas.onrender.com
      - key: EXPO_PUBLIC_ANIME_URL
        value: https://anime-python-ueas.onrender.com
      - key: EXPO_PUBLIC_PROFESORES_URL
        value: https://profesores-node-ueas.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
